aid: jambo
name: Jambo
description: 'Jambo is a mobile infrastructure company bringing blockchain and decentralized
  finance to mainstream users across emerging markets, led by its JamboPhone, a low-cost
  Web3-enabled Android smartphone with a built-in multi-chain wallet, hardware security,
  and biometric authentication. The Jambo ecosystem spans JamboWallet (a native multi-chain
  crypto wallet), JamboEarn (a gamified quest and rewards platform), and JamboPlay (a
  decentralized app store for games and digital experiences), plus the Jarvis product.
  The company reports 11M+ active wallets, over 1 million JamboPhones sold across 128+
  countries, and 60+ ecosystem partners including Coinbase, Solana, Tether, and OKX. Jambo
  raised a $30M Series A led by Paradigm with participation from Pantera Capital and others.
  Sector: crypto. As of this profile Jambo publishes a consumer product and whitepaper
  surface but no public developer/API, SDK, or documentation program.'
